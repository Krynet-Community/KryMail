version: "3.9"

services:

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: krymail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8

    restart: unless-stopped

    ports:
      - "6379:6379"

  minio:
    image: minio/minio

    command: server /data

    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniopassword

    ports:
      - "9000:9000"

    volumes:
      - minio_data:/data

volumes:

  postgres_data:

  minio_data:
